openapi: 3.1.0
info:
  title: La Victoria Bakery API
  version: v1
servers:
  - url: /api/v1
security:
  - cookieSession: []
paths:
  /auth/csrf:
    get:
      security: []
      summary: Inicia una sesión y devuelve el token CSRF
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/login:
    post:
      security: []
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Demasiados intentos }
  /auth/forgot-password:
    post:
      security: []
      summary: Envía un enlace de recuperación sin revelar si la cuenta existe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: Respuesta genérica para correos registrados y no registrados
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Demasiados intentos }
  /auth/reset-password:
    post:
      security: []
      summary: Restablece la contraseña mediante un token temporal de un solo uso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password, minLength: 8 }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Demasiados intentos }
  /auth/me:
    get:
      summary: Devuelve usuario, organizaciones, roles y sucursales
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      summary: Cierra e invalida la sesión
      responses:
        '204': { description: Sesión cerrada }
  /dashboard/summary:
    get:
      summary: Resume la operación completa de la sucursal activa
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200':
          description: Métricas exactas y actividad reciente, sin depender de paginación
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /operations/status:
    get:
      operationId: operationsStatus
      summary: Diagnóstico operativo protegido y limitado al tenant activo
      description: Requiere rol owner o admin. Las señales de plataforma son agregadas y nunca incluyen payloads.
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Readiness y señales operativas seguras
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OperationalStatus' }
        '400': { description: Faltan headers de tenant }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: Rol sin acceso al diagnóstico }
  /operations/failures:
    get:
      operationId: operationalFailures
      summary: Lista metadatos sanitizados de jobs fallidos del tenant activo
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: Rol sin acceso a revisión manual }
  /operations/failures/{operationalFailure}/resolution:
    post:
      operationId: resolveOperationalFailure
      summary: Registra la resolución humana sin reintentar el payload original
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: operationalFailure
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: El fallo ya fue resuelto }
        '422': { $ref: '#/components/responses/ValidationError' }
  /operations/notification-deliveries:
    get:
      operationId: operationalNotificationDeliveries
      summary: Lista entregas de notificación del tenant activo
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: Rol sin acceso a revisión manual }
  /operations/notification-deliveries/{notificationDelivery}/retry:
    post:
      operationId: retryOperationalNotification
      summary: Reintenta una entrega fallida sólo si el evento y el destinatario siguen vigentes
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: notificationDelivery
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'La entrega no es fallida, dejó de ser accionable o su canal está apagado' }
  /operations/webhooks:
    get:
      operationId: operationalWebhooks
      summary: Lista metadatos de webhooks sin firmas, headers ni payloads
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: Rol sin acceso a revisión manual }
  /operations/webhooks/{externalWebhook}/resolution:
    post:
      operationId: resolveOperationalWebhook
      summary: Marca revisión o resolución sin modificar la evidencia recibida
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: externalWebhook
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolution]
              properties:
                status: { type: string, enum: [manual_review, resolved] }
                resolution: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: El webhook no admite revisión en su estado actual }
        '422': { $ref: '#/components/responses/ValidationError' }
  /imports/definitions:
    get:
      operationId: importDefinitions
      summary: Devuelve campos, reglas, valores permitidos y ejemplos ficticios por tipo
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: Rol sin permiso de importación }
  /import-templates/{type}:
    get:
      operationId: downloadImportTemplate
      summary: Descarga una plantilla CSV neutralizada y reutilizable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [customers, products, suppliers, supplier_products, locations, initial_stock, recipes]
      responses:
        '200': { description: Plantilla CSV con encabezados y ejemplo ficticio }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports:
    get:
      operationId: listImportBatches
      summary: Lista lotes de importación de la organización y sucursal activas
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '403': { description: Rol sin permiso de importación }
    post:
      operationId: uploadImportBatch
      summary: Almacena temporalmente y analiza un CSV o XLSX acotado
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  type: string
                  enum: [customers, products, suppliers, supplier_products, locations, initial_stock, recipes]
                file: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '413': { description: Archivo superior al límite configurado }
        '422': { $ref: '#/components/responses/ValidationError' }
  /imports/{importBatch}:
    get:
      operationId: showImportBatch
      summary: Consulta estado, mapeo, vista previa y errores sin revelar el archivo temporal
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - name: importBatch
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports/{importBatch}/dry-run:
    post:
      operationId: dryRunImportBatch
      summary: Mapea y valida todas las filas sin mutar datos operativos
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - name: importBatch
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mapping]
              properties:
                mapping:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { description: El lote ya fue confirmado o su archivo cambió }
        '422': { $ref: '#/components/responses/ValidationError' }
  /imports/{importBatch}/confirm:
    post:
      operationId: confirmImportBatch
      summary: Confirma idempotentemente un dry-run válido y despacha el job
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: importBatch
          in: path
          required: true
          schema: { type: integer }
      responses:
        '202': { description: Lote en cola }
        '409': { description: Falta un dry-run válido y sin errores }
  /imports/{importBatch}/rollback:
    post:
      operationId: rollbackImportBatch
      summary: Revierte sólo registros sin dependencias o compensa stock con un movimiento inmutable
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: importBatch
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { description: El lote o sus dependencias impiden un rollback seguro }
        '422': { $ref: '#/components/responses/ValidationError' }
  /imports/{importBatch}/errors:
    get:
      operationId: downloadImportErrors
      summary: Descarga errores CSV sin copiar valores originales y con fórmulas neutralizadas
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - name: importBatch
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Informe CSV de errores }
        '404': { $ref: '#/components/responses/NotFound' }
  /customers:
    get:
      summary: Lista y busca clientes
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea un cliente
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{customer}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta cliente y saldo derivado
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Actualiza o activa/desactiva un cliente
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products:
    get:
      summary: Lista productos
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea un producto
      parameters: [{ $ref: '#/components/parameters/Organization' }, { $ref: '#/components/parameters/Branch' }]
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /products/{product}:
    parameters:
      - { name: product, in: path, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta un producto
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    patch:
      summary: Actualiza un producto
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /locations:
    get:
      summary: Lista ubicaciones de la sucursal activa
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      summary: Crea una ubicación en la sucursal activa
      parameters: [{ $ref: '#/components/parameters/Organization' }, { $ref: '#/components/parameters/Branch' }]
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /lots:
    get:
      summary: Lista lotes FEFO de la sucursal
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /lots/{lot}:
    get:
      summary: Consulta lote y movimientos inmutables
      parameters:
        - { name: lot, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /lots/adjustments:
    post:
      summary: Recibe o ajusta stock sin editar directamente un lote
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers:
    get:
      summary: Lista, busca, filtra y exporta proveedores de la organización
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '403': { description: Rol sin permiso de consulta de compras }
    post:
      summary: Crea un proveedor
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '403': { description: Rol sin permiso de gestión de proveedores }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers/{supplier}:
    parameters:
      - $ref: '#/components/parameters/SupplierId'
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta proveedor, catálogo e historial de precios
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Actualiza un proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: Rol sin permiso de gestión de proveedores }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers/{supplier}/active:
    post:
      summary: Activa o desactiva un proveedor sin órdenes abiertas
      parameters:
        - $ref: '#/components/parameters/SupplierId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /supplier-products:
    get:
      summary: Lista y exporta el catálogo proveedor-producto con historial
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Vincula un producto y abre su primer precio vigente
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierProductInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /supplier-products/{supplierProduct}:
    parameters:
      - $ref: '#/components/parameters/SupplierProductId'
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta vínculo e historial completo de precios
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Actualiza condiciones y agrega un precio si cambió
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierProductInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /purchase-orders:
    get:
      summary: Lista, filtra y exporta órdenes de compra de la sucursal
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea idempotentemente una orden en borrador con snapshots
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
