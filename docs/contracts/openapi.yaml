openapi: 3.1.0
info:
  title: La Victoria Bakery API
  version: v1
servers:
  - url: /api/v1
security:
  - cookieSession: []
paths:
  /auth/csrf:
    get:
      security: []
      summary: Inicia una sesión y devuelve el token CSRF
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/login:
    post:
      security: []
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Demasiados intentos }
  /auth/me:
    get:
      summary: Devuelve usuario, organizaciones, roles y sucursales
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      summary: Cierra e invalida la sesión
      responses:
        '204': { description: Sesión cerrada }
  /dashboard/summary:
    get:
      summary: Resume la operación completa de la sucursal activa
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200':
          description: Métricas exactas y actividad reciente, sin depender de paginación
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /customers:
    get:
      summary: Lista y busca clientes
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea un cliente
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{customer}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta cliente y saldo derivado
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Actualiza o activa/desactiva un cliente
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products:
    get:
      summary: Lista productos
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea un producto
      parameters: [{ $ref: '#/components/parameters/Organization' }, { $ref: '#/components/parameters/Branch' }]
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /products/{product}:
    parameters:
      - { name: product, in: path, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta un producto
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    patch:
      summary: Actualiza un producto
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /locations:
    get:
      summary: Lista ubicaciones de la sucursal activa
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      summary: Crea una ubicación en la sucursal activa
      parameters: [{ $ref: '#/components/parameters/Organization' }, { $ref: '#/components/parameters/Branch' }]
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /lots:
    get:
      summary: Lista lotes FEFO de la sucursal
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /lots/{lot}:
    get:
      summary: Consulta lote y movimientos inmutables
      parameters:
        - { name: lot, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /lots/adjustments:
    post:
      summary: Recibe o ajusta stock sin editar directamente un lote
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders:
    get:
      summary: Lista y filtra pedidos
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea un pedido
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order}:
    get:
      summary: Consulta pedido, historial y reservas
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{order}/allowed-transitions:
    get:
      summary: Lista transiciones permitidas
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /orders/{order}/transitions:
    post:
      summary: Cambia el estado con auditoría e idempotencia
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order}/delivery:
    post:
      summary: Entrega un pedido listo
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /recipes:
    get:
      summary: Lista y filtra versiones de recetas
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Crea una versión de receta
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /recipes/{recipe}:
    get:
      summary: Consulta una versión de receta con sus ingredientes
      parameters:
        - $ref: '#/components/parameters/RecipeId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Cambia el estado de una versión de receta
      parameters:
        - $ref: '#/components/parameters/RecipeId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /production-orders:
    get:
      summary: Lista órdenes de producción
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea producción para un pedido confirmado
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /production-orders/{productionOrder}:
    get:
      summary: Consulta producción
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /production-orders/{productionOrder}/requirements:
    get:
      summary: Calcula requerimientos y disponibilidad FEFO para la orden
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /production-orders/{productionOrder}/traceability:
    get:
      summary: Consulta receta congelada, lotes consumidos y lote producido
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /production-orders/{productionOrder}/start:
    post:
      summary: Inicia producción idempotentemente
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /production-orders/{productionOrder}/complete:
    post:
      summary: Registra rendimiento y merma; deja el pedido listo
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /payments:
    get:
      summary: Lista pagos por sucursal o pedido
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Registra un pago idempotente
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /payments/{payment}:
    get:
      summary: Consulta un pago
      parameters:
        - { name: payment, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /alerts:
    get:
      summary: Lista y filtra alertas operativas
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /alerts/{alert}:
    get:
      summary: Consulta y marca leída una alerta
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /alerts/{alert}/acknowledge:
    post:
      summary: Reconoce una alerta
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /alerts/{alert}/resolve:
    post:
      summary: Resuelve una alerta
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: la_victoria_session
  parameters:
    Organization:
      name: X-Organization-ID
      in: header
      required: true
      schema: { type: integer }
    Branch:
      name: X-Branch-ID
      in: header
      required: true
      schema: { type: integer }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, enum: [10, 25, 50, 100], default: 25 }
    Sort:
      name: sort
      in: query
      description: Clave de columna permitida por el recurso
      schema: { type: string }
    Direction:
      name: direction
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    Filters:
      name: filters
      in: query
      style: deepObject
      explode: true
      schema: { type: object, additionalProperties: true }
    Export:
      name: export
      in: query
      description: Devuelve el mismo resultado filtrado como libro Excel
      schema: { type: string, enum: [xlsx] }
    CustomerId:
      name: customer
      in: path
      required: true
      schema: { type: integer }
    OrderId:
      name: order
      in: path
      required: true
      schema: { type: integer }
    ProductionId:
      name: productionOrder
      in: path
      required: true
      schema: { type: integer }
    RecipeId:
      name: recipe
      in: path
      required: true
      schema: { type: integer }
    AlertId:
      name: alert
      in: path
      required: true
      schema: { type: integer }
  responses:
    Ok:
      description: Operación exitosa
    Created:
      description: Recurso creado; Idempotency-Replayed indica un reintento cuando aplica
      headers:
        Idempotency-Replayed:
          schema: { type: boolean }
    Paginated:
      description: Colección paginada server-side con data y meta
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { type: array, items: { type: object, additionalProperties: true } }
              meta: { $ref: '#/components/schemas/DataTableMeta' }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
    ValidationError:
      description: Validación o regla de negocio incumplida
    Unauthenticated:
      description: Sesión ausente o vencida
    NotFound:
      description: Recurso inexistente o fuera del tenant activo
  schemas:
    DashboardSummary:
      type: object
      required: [metrics, recent_orders, open_alerts]
      properties:
        metrics: { $ref: '#/components/schemas/DashboardMetrics' }
        recent_orders:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/DashboardOrder' }
        open_alerts:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/DashboardAlert' }
    DashboardMetrics:
      type: object
      required: [orders_total, orders_today, overdue_orders, pending_production, outstanding_balance, open_alerts, critical_stock]
      properties:
        orders_total: { type: integer, minimum: 0 }
        orders_today: { type: integer, minimum: 0 }
        overdue_orders: { type: integer, minimum: 0 }
        pending_production: { type: integer, minimum: 0 }
        outstanding_balance: { type: string, pattern: '^-?\d+\.\d{2}$' }
        open_alerts: { type: integer, minimum: 0 }
        critical_stock: { type: integer, minimum: 0 }
    DashboardOrder:
      type: object
      required: [id, organization_id, branch_id, customer_name, status, total, paid_total]
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        branch_id: { type: integer }
        customer_name: { type: string }
        status: { type: string }
        total: { type: string }
        paid_total: { type: string }
        required_at: { type: [string, 'null'], format: date-time }
    DashboardAlert:
      type: object
      required: [id, organization_id, event, condition, severity, action, status, last_seen_at]
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        branch_id: { type: [integer, 'null'] }
        event: { type: string }
        condition: { type: string }
        severity: { type: string }
        action: { type: string }
        status: { type: string }
        last_seen_at: { type: string, format: date-time }
    DataTableMeta:
      type: object
      required: [current_page, from, last_page, per_page, to, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        from: { type: [integer, 'null'] }
        last_page: { type: integer, minimum: 1 }
        per_page: { type: integer, enum: [10, 25, 50, 100] }
        to: { type: [integer, 'null'] }
        total: { type: integer, minimum: 0 }
