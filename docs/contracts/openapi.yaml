    post:
      security: []
      summary: Verifica, reduce y deduplica una señal de webhook de Mercado Pago
      responses:
        '200': { description: Evento duplicado ya recibido }
        '202': { description: Evento verificado y aceptado para consulta posterior }
        '404': { description: Webhooks desactivados por feature flag }
        '422': { $ref: '#/components/responses/ValidationError' }
  /fiscal-documents:
    get:
      summary: Lista comprobantes fiscales inmutables del tenant activo
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Emite con datos fiscales explícitos; nunca infiere condición, tipo o punto de venta
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { description: Integración ARCA desactivada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /fiscal-documents/{fiscalDocument}/reprocess:
    post:
      summary: Reprocesa en forma auditada un comprobante no autorizado
      parameters:
        - { name: fiscalDocument, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Documento autorizado o integración desactivada }
  /notifications:
    get:
      summary: Centro interno personal con trazabilidad de entrega
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /notification-preferences:
    get:
      summary: Consulta preferencias personales de canal y horas silenciosas
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      summary: Reemplaza preferencias personales para los tres canales definidos
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /push-subscriptions:
    post:
      summary: Registra cifrada una suscripción cuando el transporte push está habilitado
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { description: Push PWA desactivado }
        '422': { $ref: '#/components/responses/ValidationError' }
  /alerts:
    get:
      summary: Lista y filtra alertas operativas
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /alerts/{alert}:
    get:
      summary: Consulta y marca leída una alerta
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /alerts/{alert}/acknowledge:
    post:
      summary: Reconoce una alerta
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /alerts/{alert}/resolve:
    post:
      summary: Resuelve una alerta
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: la_victoria_session
  parameters:
    Organization:
      name: X-Organization-ID
      in: header
      required: true
      schema: { type: integer }
    Branch:
      name: X-Branch-ID
      in: header
      required: true
      schema: { type: integer }
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Identificador acotado de correlación; el servidor genera uno si es inválido o falta.
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, enum: [10, 25, 50, 100], default: 25 }
    Sort:
      name: sort
      in: query
      description: Clave de columna permitida por el recurso
      schema: { type: string }
    Direction:
      name: direction
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    Filters:
      name: filters
      in: query
      style: deepObject
      explode: true
      schema: { type: object, additionalProperties: true }
    Export:
      name: export
      in: query
      description: Devuelve el mismo resultado filtrado como libro Excel
      schema: { type: string, enum: [xlsx] }
    CustomerId:
      name: customer
      in: path
      required: true
      schema: { type: integer }
    OrderId:
      name: order
      in: path
      required: true
      schema: { type: integer }
    ProductionId:
      name: productionOrder
      in: path
      required: true
      schema: { type: integer }
    RecipeId:
      name: recipe
      in: path
      required: true
      schema: { type: integer }
    AlertId:
      name: alert
      in: path
      required: true
      schema: { type: integer }
    SupplierId:
      name: supplier
      in: path
      required: true
      schema: { type: integer }
    SupplierProductId:
      name: supplierProduct
      in: path
      required: true
      schema: { type: integer }
    PurchaseOrderId:
      name: purchaseOrder
      in: path
      required: true
      schema: { type: integer }
    PurchaseReceiptId:
      name: purchaseReceipt
      in: path
      required: true
      schema: { type: integer }
  responses:
    Ok:
      description: Operación exitosa
    Created:
      description: Recurso creado; Idempotency-Replayed indica un reintento cuando aplica
      headers:
        Idempotency-Replayed:
          schema: { type: boolean }
    Paginated:
      description: Colección paginada server-side con data y meta
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { type: array, items: { type: object, additionalProperties: true } }
              meta: { $ref: '#/components/schemas/DataTableMeta' }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
    ValidationError:
      description: Validación o regla de negocio incumplida
    Unauthenticated:
      description: Sesión ausente o vencida
    NotFound:
      description: Recurso inexistente o fuera del tenant activo
  schemas:
    SupplierInput:
      type: object
      required: [trade_name, lead_time_days]
      properties:
        trade_name: { type: string, maxLength: 255 }
        legal_name: { type: [string, 'null'], maxLength: 255 }
        tax_id: { type: [string, 'null'], maxLength: 32 }
        email: { type: [string, 'null'], format: email, maxLength: 255 }
        phone: { type: [string, 'null'], maxLength: 64 }
        contact_name: { type: [string, 'null'], maxLength: 255 }
        address: { type: [string, 'null'], maxLength: 2000 }
        payment_terms: { type: [string, 'null'], maxLength: 255 }
        lead_time_days: { type: integer, minimum: 0, maximum: 365 }
        notes: { type: [string, 'null'], maxLength: 5000 }
        active: { type: boolean, default: true }
    SupplierProductInput:
      type: object
      required: [supplier_id, product_id, purchase_unit, conversion_factor, minimum_quantity, lead_time_days, price, currency, price_valid_from]
      properties:
        supplier_id: { type: integer }
        product_id: { type: integer }
        supplier_code: { type: [string, 'null'], maxLength: 255 }
        purchase_unit: { type: string, enum: [unit, kg, g, l, ml] }
        conversion_factor: { type: string, pattern: '^\d+(\.\d{1,6})?$' }
        minimum_quantity: { type: string, pattern: '^\d+(\.\d{1,3})?$' }
        lead_time_days: { type: integer, minimum: 0, maximum: 365 }
        preferred: { type: boolean, default: false }
        active: { type: boolean, default: true }
        price: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: string, enum: [ARS, USD] }
        price_valid_from: { type: string, format: date }
    PurchaseOrderInput:
      type: object
      required: [supplier_id, ordered_at, currency, items]
      properties:
        supplier_id: { type: integer }
        ordered_at: { type: string, format: date }
        expected_at: { type: [string, 'null'], format: date }
        currency: { type: string, enum: [ARS, USD] }
        payment_terms: { type: [string, 'null'], maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 5000 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [supplier_product_id, quantity]
            properties:
              supplier_product_id: { type: integer }
              quantity: { type: string, pattern: '^\d+(\.\d{1,3})?$' }
              unit_price: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
              tax_amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
    PurchaseReceiptInput:
      type: object
      required: [received_at, items]
      properties:
        received_at: { type: string, format: date-time }
        notes: { type: [string, 'null'], maxLength: 5000 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [purchase_order_item_id, location_id, received_quantity, accepted_quantity, rejected_quantity, lot_code]
            properties:
              purchase_order_item_id: { type: integer }
              location_id: { type: integer }
              received_quantity: { type: string, pattern: '^\d+(\.\d{1,3})?$' }
              accepted_quantity: { type: string, pattern: '^\d+(\.\d{1,3})?$' }
              rejected_quantity: { type: string, pattern: '^\d+(\.\d{1,3})?$' }
              discrepancy_type:
                type: [string, 'null']
                enum: [shortage, excess, damaged, quality, wrong_product, other, null]
              discrepancy_reason: { type: [string, 'null'], maxLength: 255 }
              lot_code: { type: string, maxLength: 255 }
              manufactured_at: { type: [string, 'null'], format: date-time }
              expires_at: { type: [string, 'null'], format: date }
              actual_unit_cost: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$' }
    DashboardSummary:
      type: object
      required: [metrics, recent_orders, open_alerts]
      properties:
        metrics: { $ref: '#/components/schemas/DashboardMetrics' }
        recent_orders:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/DashboardOrder' }
        open_alerts:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/DashboardAlert' }
    OperationalStatus:
      type: object
      required: [status, system, platform_signals, tenant_signals, request_id]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        request_id: { type: string }
        system:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: { type: string, enum: [postgresql, redis, storage, migrations, worker_heartbeat, scheduler_heartbeat] }
              status: { type: string, enum: [pass, fail] }
        platform_signals:
          type: object
          required: [scope, last_job_success, last_job_failure, failed_jobs, backup]
          properties:
            scope: { type: string, const: platform }
            last_job_success: { $ref: '#/components/schemas/JobSignal' }
            last_job_failure: { $ref: '#/components/schemas/JobSignal' }
            failed_jobs: { type: [integer, 'null'], minimum: 0 }
            backup:
              type: object
              required: [status, last_manifest_at]
              properties:
                status: { type: string, enum: [not_configured, missing, fresh, overdue, unavailable] }
                last_manifest_at: { type: [string, 'null'], format: date-time }
        tenant_signals:
          type: object
          required: [scope, old_pending_notifications, failed_notifications, external_transactions_attention, fiscal_documents_pending]
          properties:
            scope:
              type: object
              required: [organization_id, branch_id]
              properties:
                organization_id: { type: integer }
                branch_id: { type: integer }
            old_pending_notifications: { type: [integer, 'null'], minimum: 0 }
            failed_notifications: { type: [integer, 'null'], minimum: 0 }
            external_transactions_attention: { type: [integer, 'null'], minimum: 0 }
            fiscal_documents_pending: { type: [integer, 'null'], minimum: 0 }
    JobSignal:
      type: object
      required: [status, at, job]
      properties:
        status: { type: string, enum: [recorded, missing, unavailable] }
        at: { type: [string, 'null'], format: date-time }
        job: { type: [string, 'null'] }
    DashboardMetrics:
      type: object
      required: [orders_total, orders_today, overdue_orders, pending_production, outstanding_balance, open_alerts, critical_stock]
      properties:
        orders_total: { type: integer, minimum: 0 }
        orders_today: { type: integer, minimum: 0 }
        overdue_orders: { type: integer, minimum: 0 }
        pending_production: { type: integer, minimum: 0 }
        outstanding_balance: { type: string, pattern: '^-?\d+\.\d{2}$' }
        open_alerts: { type: integer, minimum: 0 }
        critical_stock: { type: integer, minimum: 0 }
    DashboardOrder:
      type: object
      required: [id, organization_id, branch_id, customer_name, status, total, paid_total]
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        branch_id: { type: integer }
        customer_name: { type: string }
        status: { type: string }
        total: { type: string }
        paid_total: { type: string }
        required_at: { type: [string, 'null'], format: date-time }
    DashboardAlert:
      type: object
      required: [id, organization_id, event, condition, severity, action, status, last_seen_at]
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        branch_id: { type: [integer, 'null'] }
        event: { type: string }
        condition: { type: string }
        severity: { type: string }
        action: { type: string }
        status: { type: string }
        last_seen_at: { type: string, format: date-time }
    DataTableMeta:
      type: object
      required: [current_page, from, last_page, per_page, to, total]
      properties:
        current_page: { type: integer, minimum: 1 }
        from: { type: [integer, 'null'] }
        last_page: { type: integer, minimum: 1 }
        per_page: { type: integer, enum: [10, 25, 50, 100] }
        to: { type: [integer, 'null'] }
        total: { type: integer, minimum: 0 }
