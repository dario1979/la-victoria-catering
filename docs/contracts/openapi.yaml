openapi: 3.1.0
info:
  title: La Victoria Bakery API
  version: v1
servers:
  - url: /api/v1
security:
  - cookieSession: []
paths:
  /auth/csrf:
    get:
      security: []
      summary: Inicia una sesión y devuelve el token CSRF
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/login:
    post:
      security: []
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Demasiados intentos }
  /auth/forgot-password:
    post:
      security: []
      summary: Envía un enlace de recuperación sin revelar si la cuenta existe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: Respuesta genérica para correos registrados y no registrados
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Demasiados intentos }
  /auth/reset-password:
    post:
      security: []
      summary: Restablece la contraseña mediante un token temporal de un solo uso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password, minLength: 8 }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Demasiados intentos }
  /auth/me:
    get:
      summary: Devuelve usuario, organizaciones, roles y sucursales
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      summary: Cierra e invalida la sesión
      responses:
        '204': { description: Sesión cerrada }
  /dashboard/summary:
    get:
      summary: Resume la operación completa de la sucursal activa
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200':
          description: Métricas exactas y actividad reciente, sin depender de paginación
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /customers:
    get:
      summary: Lista y busca clientes
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea un cliente
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{customer}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta cliente y saldo derivado
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Actualiza o activa/desactiva un cliente
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products:
    get:
      summary: Lista productos
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea un producto
      parameters: [{ $ref: '#/components/parameters/Organization' }, { $ref: '#/components/parameters/Branch' }]
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /products/{product}:
    parameters:
      - { name: product, in: path, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta un producto
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    patch:
      summary: Actualiza un producto
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /locations:
    get:
      summary: Lista ubicaciones de la sucursal activa
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      summary: Crea una ubicación en la sucursal activa
      parameters: [{ $ref: '#/components/parameters/Organization' }, { $ref: '#/components/parameters/Branch' }]
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /lots:
    get:
      summary: Lista lotes FEFO de la sucursal
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /lots/{lot}:
    get:
      summary: Consulta lote y movimientos inmutables
      parameters:
        - { name: lot, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /lots/adjustments:
    post:
      summary: Recibe o ajusta stock sin editar directamente un lote
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers:
    get:
      summary: Lista, busca, filtra y exporta proveedores de la organización
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '403': { description: Rol sin permiso de consulta de compras }
    post:
      summary: Crea un proveedor
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '403': { description: Rol sin permiso de gestión de proveedores }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers/{supplier}:
    parameters:
      - $ref: '#/components/parameters/SupplierId'
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta proveedor, catálogo e historial de precios
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Actualiza un proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: Rol sin permiso de gestión de proveedores }
        '422': { $ref: '#/components/responses/ValidationError' }
  /suppliers/{supplier}/active:
    post:
      summary: Activa o desactiva un proveedor sin órdenes abiertas
      parameters:
        - $ref: '#/components/parameters/SupplierId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /supplier-products:
    get:
      summary: Lista y exporta el catálogo proveedor-producto con historial
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Vincula un producto y abre su primer precio vigente
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierProductInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /supplier-products/{supplierProduct}:
    parameters:
      - $ref: '#/components/parameters/SupplierProductId'
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta vínculo e historial completo de precios
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Actualiza condiciones y agrega un precio si cambió
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierProductInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /purchase-orders:
    get:
      summary: Lista, filtra y exporta órdenes de compra de la sucursal
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea idempotentemente una orden en borrador con snapshots
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /purchase-orders/{purchaseOrder}:
    parameters:
      - $ref: '#/components/parameters/PurchaseOrderId'
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Branch'
    get:
      summary: Consulta orden, renglones, transiciones y recepciones
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Reemplaza un borrador; una orden aprobada es inmutable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /purchase-orders/{purchaseOrder}/allowed-transitions:
    get:
      summary: Lista transiciones manuales permitidas para la orden
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /purchase-orders/{purchaseOrder}/transitions:
    post:
      summary: Aprueba, envía o cancela idempotentemente con auditoría
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, sent, cancelled] }
                reason: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /purchase-orders/{purchaseOrder}/receipts:
    post:
      summary: Registra recepción idempotente y crea lotes y movimientos inmutables
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseReceiptInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /purchase-receipts:
    get:
      summary: Lista y exporta recepciones de compra de la sucursal
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /purchase-receipts/{purchaseReceipt}:
    get:
      summary: Consulta recepción, orden, discrepancias, lotes y movimientos
      parameters:
        - $ref: '#/components/parameters/PurchaseReceiptId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    get:
      summary: Lista y filtra pedidos
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea un pedido
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order}:
    get:
      summary: Consulta pedido, historial y reservas
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{order}/allowed-transitions:
    get:
      summary: Lista transiciones permitidas
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /orders/{order}/transitions:
    post:
      summary: Cambia el estado con auditoría e idempotencia
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order}/delivery:
    post:
      summary: Entrega un pedido listo
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /recipes:
    get:
      summary: Lista y filtra versiones de recetas
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Crea una versión de receta
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /recipes/{recipe}:
    get:
      summary: Consulta una versión de receta con sus ingredientes
      parameters:
        - $ref: '#/components/parameters/RecipeId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Cambia el estado de una versión de receta
      parameters:
        - $ref: '#/components/parameters/RecipeId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /production-orders:
    get:
      summary: Lista órdenes de producción
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Filters'
        - $ref: '#/components/parameters/Export'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      summary: Crea producción para un pedido confirmado
      parameters:
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Created' }
  /production-orders/{productionOrder}:
    get:
      summary: Consulta producción
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /production-orders/{productionOrder}/requirements:
    get:
      summary: Calcula requerimientos y disponibilidad FEFO para la orden
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /production-orders/{productionOrder}/traceability:
    get:
      summary: Consulta receta congelada, lotes consumidos y lote producido
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /production-orders/{productionOrder}/start:
    post:
      summary: Inicia producción idempotentemente
      parameters:
        - $ref: '#/components/parameters/ProductionId'
        - $ref: '#/components/parameters/Organization'
        - $ref: '#/components/parameters/Branch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /production-orders/{productionOrder}/complete:
    post:
      summary: Registra rendimiento y merma; deja el pedido listo
      parameters:
        - $ref: '#/components/parameters/ProductionId'
