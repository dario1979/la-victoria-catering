name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: la_victoria_test
          POSTGRES_USER: la_victoria
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U la_victoria -d la_victoria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: la_victoria_test
      DB_USERNAME: la_victoria
      DB_PASSWORD: test_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, pcntl, pdo_pgsql, redis, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: mkdir -p storage/test-results
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --strict
      - name: Audit Composer dependencies
        run: composer audit --format=json > storage/test-results/composer-audit.json
      - name: Rebuild and seed PostgreSQL
        run: php artisan migrate:fresh --seed --force
      - name: Record migrations and routes
        run: |
          php artisan migrate:status > storage/test-results/migrations.txt
          php artisan route:list --json > storage/test-results/routes.json
      - name: Run PHPUnit
        run: php artisan test --log-junit storage/test-results/phpunit.xml
      - run: vendor/bin/pint --test
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          path: storage/test-results
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend · Vue PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p storage/test-results
      - run: npm ci
      - name: Validate OpenAPI contract
        run: npm run lint:openapi -- --format=json --max-problems=1000 > storage/test-results/openapi-lint.json
      - name: Run frontend tests
        run: npm run test:frontend -- --reporter=default --reporter=junit --outputFile=storage/test-results/vitest.xml
      - run: npm run test:pwa
      - run: npm run typecheck
      - run: npm run build
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --json > storage/test-results/npm-audit-production.json
      - name: Preserve build manifest
        run: cp public/build/manifest.json storage/test-results/vite-manifest.json
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence
          path: storage/test-results
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker · Build and smoke
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      APP_URL: http://127.0.0.1:8080
      DEMO_USER_PASSWORD: 123456
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: mkdir -p .ci-artifacts
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate staging Compose structurally
        run: docker compose --env-file .env.staging.example -f compose.staging.yaml config --quiet
        env:
          APP_URL: https://staging.example.invalid
          DB_DATABASE: la_victoria_staging_ci
          DB_USERNAME: la_victoria_staging_ci
          DB_PASSWORD: staging-ci-database-only
          REDIS_PASSWORD: staging-ci-redis-only
          SESSION_DOMAIN: staging.example.invalid
          MAIL_FROM_ADDRESS: no-reply@staging.example.invalid
          DEMO_USER_PASSWORD: staging-ci-demo-only
          STAGING_ENV_FILE: .env.staging.example
          STAGING_IMAGE_TAG: ci
      - name: Build images
        run: docker compose build
      - name: Start ephemeral stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Rebuild seeded smoke database
        run: docker compose exec -T backend php artisan migrate:fresh --seed --force
      - name: Run authenticated HTTP smoke
        run: bash scripts/ci-smoke.sh http://127.0.0.1:8080 http://127.0.0.1:8000
        env:
          SMOKE_EMAIL: admin@lavictoria.test
          SMOKE_PASSWORD: 123456
      - name: Capture Docker diagnostics
        if: failure()
        run: |
          docker compose ps --all > .ci-artifacts/docker-ps.txt
          docker compose logs --no-color > .ci-artifacts/docker-compose.log
      - name: Upload Docker failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-failure-diagnostics
          path: .ci-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  e2e:
    name: E2E · Playwright operational journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated E2E stack
        run: bash scripts/e2e-stack.sh up
      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_PASSWORD: 123456
      - name: Capture E2E service logs
        if: failure()
        run: |
          mkdir -p .e2e-artifacts
          bash scripts/e2e-stack.sh logs > .e2e-artifacts/docker-compose.log
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
            .e2e-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy isolated E2E stack
        if: always()
        run: bash scripts/e2e-stack.sh down
